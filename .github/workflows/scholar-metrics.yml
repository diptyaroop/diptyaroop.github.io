name: Refresh Google Scholar metrics
on:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [master]
    paths:
      - 'scripts/update_scholar.py'
      - 'tests/test_scholar.py'
      - '.github/workflows/scholar-metrics.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scholar-metrics
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
      - name: Test metrics parsing and failure behavior
        run: |
          python3 -m unittest discover -s tests -v
          node tests/test_scholar_client.cjs
      - name: Read current Google Scholar metrics
        run: python3 scripts/update_scholar.py
      - name: Save verified metrics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/data/scholar.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update verified Google Scholar metrics'
          git pull --rebase origin master
          git push origin HEAD:master
